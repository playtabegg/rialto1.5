<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bonus Content</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #eee;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #222;
            padding: 10px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        .item {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
        }
        .caption {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 8px;
        }
        video, audio, img, iframe {
            width: 100%;
            border-radius: 4px;
        }
        .toggle-bar {
            background: #333;
            padding: 10px;
            text-align: center;
        }
        .toggle-bar button {
            padding: 5px 15px;
            margin: 5px;
            background: #444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .toggle-bar button:hover {
            background: #666;
        }
        .notes {
            margin: 20px;
            background: #222;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
    <script>
        function toggleCaptions() {
            const captions = document.querySelectorAll('.caption');
            for (let cap of captions) {
                cap.style.display = (cap.style.display === 'none') ? 'block' : 'none';
            }
        }
    </script>
</head>
<body>
<!-- Floating Music Player -->
    <div id="floating-player" style="
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #222;
        border: 1px solid #444;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 0 10px #000;
        z-index: 1000;">
        <div id="player-label" style="color: #fff; margin-bottom: 5px;">🎵 Now Playing:</div>
        <audio id="player-audio" controls style="width: 300px;"></audio>
    </div>
    <header>Bonus Content</header>
    <div class="toggle-bar">
        <button onclick="toggleCaptions()">Toggle Captions</button>
    </div>
    <div class="grid">
        <!-- Bonus items go here -->
        {{bonus_items}}
    </div>
    <!-- Developer Notes Toggle -->
    <div class="toggle-bar">
            <button onclick="toggleNotes()">📝 Developer Notes</button>
    </div>
    <div class="notes" id="dev-notes" style="display: none;">
            <h2>📝 Developer Notes</h2>
            <p>{{dev_notes}}</p>
    </div>

    <div class="notes">
        {{dev_notes}}
    </div>
    <script>
        function toggleCaptions() {
            const captions = document.querySelectorAll('.caption');
            for (let cap of captions) {
                cap.style.display = (cap.style.display === 'none') ? 'block' : 'none';
            }
        }
        function toggleNotes() {
                const notes = document.getElementById("dev-notes");
                if (notes.style.display === "none") {
                        notes.style.display = "block";
                } else {
                        notes.style.display = "none";
                }
        }
    </script>

</body>
</html>
